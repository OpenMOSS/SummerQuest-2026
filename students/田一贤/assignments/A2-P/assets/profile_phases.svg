  <rect x="55" y="85" width="225" height="95" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="125" y="137" font-family="sans-serif" font-size="18" fill="#1e3a8a">forward</text>
  <rect x="280" y="85" width="225" height="95" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="348" y="137" font-family="sans-serif" font-size="18" fill="#7f1d1d">backward</text>
