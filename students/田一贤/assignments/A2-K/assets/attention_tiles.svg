<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Tiled online softmax attention schematic">
  <rect width="760" height="300" fill="#f7fafc"/>
  <text x="30" y="38" font-family="sans-serif" font-size="24" fill="#1a202c">Independent tiled attention</text>
  <rect x="45" y="75" width="210" height="170" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="70" y="110" font-family="sans-serif" font-size="18" fill="#1e3a8a">Q tile</text>
  <text x="70" y="140" font-family="sans-serif" font-size="15" fill="#1e3a8a">64 queries × d</text>
  <text x="70" y="175" font-family="sans-serif" font-size="15" fill="#1e3a8a">one program instance</text>
  <path d="M275 160 H350" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="365" y="75" width="175" height="170" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="385" y="110" font-family="sans-serif" font-size="18" fill="#14532d">K/V tiles</text>
  <text x="385" y="140" font-family="sans-serif" font-size="15" fill="#14532d">loop over keys</text>
  <text x="385" y="175" font-family="sans-serif" font-size="15" fill="#14532d">causal mask</text>
  <path d="M560 160 H635" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="650" y="75" width="75" height="170" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="665" y="125" font-family="sans-serif" font-size="16" fill="#78350f">O</text>
  <text x="665" y="155" font-family="sans-serif" font-size="13" fill="#78350f">+ LSE</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
</svg>
